name: Stress
# Manual and nightly. Never on a pull request: this is load, sandbox and matrix work
# that would slow every normal push. The push trigger is narrowed to the stress files
# themselves, so a change to them is exercised on its own branch before the nightly.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'        # 19:17 UTC nightly
  push:
    paths:
      - stress_http.py
      - stress_docker.py
      - test_stress_http.py
      - .github/workflows/stress.yml

concurrency:
  group: stress
  cancel-in-progress: false

jobs:
  http-stress:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: reduced stress inside the suite
        run: python -m unittest -v test_stress_http
      - name: full HTTP stress (six owners, two rounds)
        run: python stress_http.py --owners 6 --rounds 2

  docker-sandbox:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    # compose interpolates the whole file for every subcommand, including down and logs,
    # so these belong to the job: with them scoped to one step, `docker compose down -v`
    # failed with "required variable GROK_APP_PASSWORD is missing a value".
    env:
      AGENTIC_APP_PASSWORD: ci-only-not-a-secret
      AGENTIC_SESSION_SECRET: ci-only-session-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: docker daemon present
        run: docker info --format '{{.ServerVersion}}'
      - name: sandbox backend properties (network off, read-only root, Stop)
        run: python stress_docker.py
      # The image HEALTHCHECK used to probe /key_status, which the password gate
      # redirects to /login for a cookie-less probe. It now probes /health, an
      # intentionally open liveness route; check it here too so a broken probe
      # fails the compose step rather than silently reporting an unhealthy stack.
      - name: compose stack boots and serves
        run: |
          docker compose up -d --build
          ready=no
          for i in $(seq 1 90); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/health 2>/dev/null || true)
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q agenticbot)" 2>/dev/null || true)
            if [ "$code" = "200" ] && [ "$status" = "healthy" ]; then
              echo "stack answered on /health and the container is $status"
              ready=yes
              break
            fi
            sleep 3
          done
          if [ "$ready" != "yes" ]; then
            echo "health endpoint: $code; container health: $status"
            exit 1
          fi
      - name: compose logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 200
      - name: tear down
        if: always()
        run: docker compose down -v --remove-orphans
