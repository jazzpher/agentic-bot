name: Lint
# Two tiers. The gate blocks the build on ruff's critical set - syntax errors, undefined
# names, invalid `is` comparisons - which the tree was already clean of, so it is safe to
# block on today. The full default set still reports pre-existing findings (E401 x11,
# E731 x6, F841 x13, F401 x3, E402 x2, E741 x1 when this was written), so it stays a
# report: fix those, then delete `continue-on-error` and the gate step's narrower
# `--select`, and one `ruff check .` gates everything. E701/E702 (several statements on
# one line) are ignored in [tool.ruff.lint] on purpose.
# Rules and exclusions live in [tool.ruff] in pyproject.toml.
on: [push, pull_request]
jobs:
  ruff:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: ruff gate (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 --output-format=concise .
      - name: ruff report (pre-existing findings)
        if: always()
        continue-on-error: true
        run: ruff check --output-format=concise .
      - name: ruff statistics (pre-existing findings)
        if: always()
        run: ruff check --statistics . || true
