[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bot"
version = "0.9.3"
description = "Local tool-using coding/chat agent (web UI + CLI) for any OpenAI-compatible provider"
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: MIT License"]
license = {file = "LICENSE"}
dependencies = [
  "requests",
  "flask",
  "pypdf>=6.0,<7",
  "defusedxml>=0.7,<1",
  "pillow>=10.0",
]

[project.scripts]
agentic-bot = "agenticbot.cli:main"
agenticbot = "agenticbot.cli:main"
grokbot = "agenticbot.cli:main"
grok-bot = "agenticbot.cli:main"

[tool.setuptools]
packages = ["agenticbot", "agenticbot.tools", "agenticbot.gateway", "grokbot"]
py-modules = ["webui", "agent_loop", "task_harness", "skills", "documents", "model_discovery", "bot", "browser_tools"]
include-package-data = true

[tool.setuptools.package-data]
"agenticbot" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.webmanifest", "static/vendor/*"]
